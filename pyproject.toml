[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rooom-gateway"
version = "0.3.0"
description = "Enterprise LLM gateway with policy, privacy, reliability, budgets, and provider integration"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ROOOMTECH"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "litellm>=1.92.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
